name: zealot-s3-integration
services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: zealot-test-only
      POSTGRES_DB: zealot
    networks:
      default:
        aliases: [zealot-s3-test-db]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d zealot']
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: server /data
    environment:
      MINIO_ROOT_USER: zealot-test
      MINIO_ROOT_PASSWORD: zealot-test-only
    networks:
      default:
        aliases: [zealot-s3-test-store]
  runner:
    image: zealot-s3:test
    entrypoint: []
    env_file: test.env
    volumes:
      - ../../test:/app/test:ro
