zh-CN:
  activerecord:
    attributes:
      scheme:
        install_alias: 自定义链接后缀
        install_code: 固定短链接
        android_channel: Android 渠道
        ios_channel: iOS 渠道
      channel:
        install_alias: 自定义链接后缀
  install_links:
    title: 应用安装
    description: 使用手机打开此链接，将自动进入对应系统的安装页。你也可以手动选择平台。
    alias: 自定义链接后缀
    alias_hint: 例如 ZOCharge。支持 1–64 位英文字母、数字、短横线和下划线；修改后原链接仍然可用。
    unified: 双端统一安装
    link: 安装链接
    short_link: 固定短链接（始终有效）
    android_channel: Android 渠道
    ios_channel: iOS 渠道
    channel_hint: 未指定时自动使用此类型下唯一的对应平台渠道；同平台有多个渠道时请明确选择。公开访问仍由渠道分享设置决定。
    automatic: 自动选择唯一渠道
    scan: 扫码安装
    scan_hint: Android 和 iPhone 使用同一个二维码，自动进入对应安装页。
    qrcode_alt: Android 和 iOS 统一安装二维码
    open_platform: "进入 %{platform} 安装页"
    platform_unavailable: "当前没有可访问的 %{platform} 渠道，请联系应用管理员。"
    password_required: 进入安装页后需输入访问密码。
    version: "版本 %{version}（%{build}）"
    errors:
      unavailable: 不可用：请使用 1–64 位英文字母、数字、短横线或下划线，且不能与系统路径或已有链接重复。
      immutable: 固定短链接不能修改。
      channel: 必须选择当前应用类型下对应平台的渠道。
en:
  activerecord:
    attributes:
      scheme:
        install_alias: Custom link suffix
        install_code: Permanent short link
        android_channel: Android channel
        ios_channel: iOS channel
      channel:
        install_alias: Custom link suffix
  install_links:
    title: Install application
    description: Open this link on a phone to select its platform automatically, or choose a platform below.
    alias: Custom link suffix
    alias_hint: For example ZOCharge. Use 1–64 letters, digits, hyphens or underscores. Previous links keep working after changes.
    unified: Unified Android / iOS installation
    link: Install link
    short_link: Permanent short link
    android_channel: Android channel
    ios_channel: iOS channel
    channel_hint: Uses the only matching channel when left blank. Select explicitly if there are multiple channels for a platform. Channel sharing settings still apply.
    automatic: Automatically select the only channel
    scan: Scan to install
    scan_hint: Android and iPhone share this QR code and open the appropriate install page.
    qrcode_alt: Unified Android and iOS install QR code
    open_platform: "Open %{platform} install page"
    platform_unavailable: "No accessible %{platform} channel is available. Contact the application administrator."
    password_required: An access password is required on the install page.
    version: "Version %{version} (%{build})"
    errors:
      unavailable: is unavailable. Use 1–64 letters, digits, hyphens or underscores without conflicting with system paths or existing links.
      immutable: The permanent short link cannot be changed.
      channel: Must belong to the current application scheme and match the platform.
